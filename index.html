<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HTML Utils</title>
  <meta name="description" content="Lightweight browser-based HTML/CSS utilities" />
  <meta property="og:title" content="HTML Utils" />
  <meta property="og:description" content="Lightweight browser-based HTML/CSS utilities" />
  <meta property="og:type" content="website" />
  <link rel="stylesheet" type="text/css" href="assets/css/tailwind.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script defer src="assets/js/alpine.min.js"></script>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0f0f0f" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192x192.png" />
</head>

<body x-data="remConverterApp()" x-cloak class="font-mono text-[13px] min-h-screen">
  <div class="max-w-lg mx-auto px-4 py-12">
    <!-- HEADER -->
    <div class="mb-8">
      <div class="flex items-center justify-between mb-1">
        <span class="text-lg font-medium tracking-tight" x-text="t.title"></span>
        <button @click="toggleLang()" class="btn-secondary text-[11px] px-2.5 py-1 rounded-md"
          x-text="lang === 'it' ? 'EN' : 'IT'" title="Switch language"></button>
      </div>
    </div>
    <!-- CARD -->
    <div class="card mb-4 space-y-5">
      <!-- ROOT FONT SIZE -->
      <div>
        <label class="label mb-2" x-text="t.rootSize"></label>
        <div class="flex items-center gap-2">
          <input type="number" x-model.number="rootSize" min="1" max="64"
            class="field flex-1 h-9 rounded-lg px-3 py-2 font-medium" />
          <span class="text-[11px] text-muted">px</span>
        </div>
      </div>
      <!-- DIRECTION TOGGLE -->
      <div>
        <div class="grid grid-cols-2 gap-2">
          <button @click="direction = 'pxToRem'; isCopied = false"
            :class="['mode-btn rounded-lg py-2 px-3 text-[11px] font-medium text-center', direction === 'pxToRem' ? 'active' : '']"
            x-text="t.pxToRem"></button>
          <button @click="direction = 'remToPx'; isCopied = false"
            :class="['mode-btn rounded-lg py-2 px-3 text-[11px] font-medium text-center', direction === 'remToPx' ? 'active' : '']"
            x-text="t.remToPx"></button>
        </div>
      </div>
      <!-- INPUT / OUTPUT ROW -->
      <div class="flex items-end gap-3">
        <!-- Input -->
        <div class="flex-1">
          <label class="label mb-2" x-text="inputLabel"></label>
          <input type="number" x-model="inputValue" min="0" step="any" placeholder="0"
            class="field w-full h-9 rounded-lg px-3 py-2 font-medium" />
        </div>
        <!-- Switch button -->
        <button @click="switchDirection()"
          class="btn-secondary w-9 h-9 rounded-lg flex items-center justify-center shrink-0 mb-0" :title="t.switchDir">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 6 3 12l6 6" />
            <path d="M15 6l6 6-6 6" />
          </svg>
        </button>
        <!-- Output -->
        <div class="flex-1">
          <label class="label mb-2" x-text="outputLabel"></label>
          <div class="field w-full h-9 rounded-lg px-3 py-2 font-medium flex items-center result-display"
            :class="result ? '' : 'placeholder-state'">
            <span x-text="result || '—'" class="truncate"></span>
          </div>
        </div>
      </div>
      <!-- COPY BUTTON -->
      <button @click="copyResult()" :disabled="!result"
        class="btn-secondary h-10 w-full rounded-lg text-[12px] flex items-center justify-center gap-2"
        :class="!result ? 'opacity-40 cursor-not-allowed' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
        <span x-text="isCopied ? t.resultCopied : t.copyResult"></span>
      </button>
    </div>
    <!-- FOOTER -->
    <div class="divider pt-5 flex items-center justify-center text-[11px]">
      <span class="text-muted" style="opacity:0.7">
        <span x-text="t.madeWith"></span>
        <a href="https://claude.ai" target="_blank" rel="noopener" class="footer-link">Claude</a>
        (Anthropic)
      </span>
    </div>
  </div>
  <script src="assets/js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/html-utils/sw.js');
    }
  </script>
</body>

</html>
